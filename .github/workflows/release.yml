name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release (RC)?"
        type: boolean
        default: false
      dry_run:
        description: "Dry run (build only, skip release)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: "Version from release-please"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Floor for every job. release-please calls this workflow with contents: write,
# which prepare and build have no use for; the release job re-grants it below.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────
  # Prepare: Extract version from different trigger sources
  # ─────────────────────────────────────────────────────────────
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Extract version
        id: version
        # Inputs arrive via env, never interpolated into the script body:
        # ${{ }} is substituted as text before bash parses the line, so a
        # crafted version string would otherwise execute as a command.
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            DRY_RUN="${INPUT_DRY_RUN:-false}"
            PRERELEASE="${INPUT_PRERELEASE:-false}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            DRY_RUN="false"
            PRERELEASE="false"
          fi

          # Bash =~ anchors against the whole string. grep would not: it matches
          # per line, so a version containing a newline would pass ^...$ on its
          # first line and then write extra keys into $GITHUB_OUTPUT.
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Refusing to release malformed version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION (dry_run: $DRY_RUN, prerelease: $PRERELEASE)"

  # ─────────────────────────────────────────────────────────────
  # Build: Install, lint, build, package
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: [prepare]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm run ci

      - run: pnpm run build

      - name: Lint Firefox manifest
        run: pnpm run lint:firefox

      - name: Create ZIP files
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          cd dist/chrome
          zip -r "../../github-flex-chrome-v${VERSION}.zip" .
          cd ../firefox
          zip -r "../../github-flex-firefox-v${VERSION}.zip" .

      - name: Generate checksums
        run: sha256sum github-flex-*.zip > checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
            github-flex-*.zip
            checksums.txt
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  # Release: Create GitHub Release with assets
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.prerelease == 'true' && '-rc' || '' }}
          name: v${{ needs.prepare.outputs.version }}${{ needs.prepare.outputs.prerelease == 'true' && ' (RC)' || '' }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            github-flex-*.zip
            checksums.txt
